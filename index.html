<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premier League standings</title>
<style>
  html,body{margin:0;background:#FFFFFF;color:#1E1D1B;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
  .wrap{box-sizing:border-box;max-width:760px;margin:0 auto;padding:20px 16px 28px}
  header{padding-bottom:14px;border-bottom:4px solid #08C461}
  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;color:#E22608}
  .sub{margin:10px 0 14px;font-size:14px;color:#5B5953}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{padding:8px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5B5953;text-align:center;border-bottom:2px solid #E4E1DA}
  th.team,td.team{text-align:left}
  td{padding:10px 6px;text-align:center;border-bottom:1px solid #E4E1DA}
  td.rank{width:28px;color:#5B5953}
  tbody tr:first-child td.rank{color:#E22608;font-weight:800}
  .tm{display:flex;align-items:center;gap:10px;font-weight:700}
  .tm img{width:26px;height:26px;object-fit:contain}
  td.pts{font-weight:800}
  .note{margin:14px 0 0;font-size:12px;color:#5B5953}
  .msg{padding:16px;background:#F4F2ED;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Premier League standings</h1></header>
  <p class="sub" id="sub">Loading the latest table...</p>
  <div id="table"></div>
  <p class="note">Data from TheSportsDB (the free version shows the top 5 teams). The table refreshes each time this page loads.</p>
</div>
<script>
(function () {
  var now = new Date(), y = now.getFullYear();
  var season = now.getMonth() >= 6 ? y + '-' + (y + 1) : (y - 1) + '-' + y;
  var url = 'https://www.thesportsdb.com/api/v1/json/123/lookuptable.php?l=4328&s=' + season;
  var box = document.getElementById('table'), sub = document.getElementById('sub');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fail() { sub.textContent = ''; box.appendChild(el('div', 'msg', 'The standings are not available right now. Please try again in a few minutes.')); }
  fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    var rows = (j && j.table) || [];
    if (!rows.length) { return fail(); }
    sub.textContent = 'Season ' + season + '  |  ' + rows[0].intPlayed + ' matches played';
    var t = el('table'), thead = el('thead'), head = el('tr');
    [['#', 'rank'], ['Team', 'team'], ['P', ''], ['W', ''], ['D', ''], ['L', ''], ['GD', ''], ['Pts', '']].forEach(function (h) { head.appendChild(el('th', h[1], h[0])); });
    thead.appendChild(head); t.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var tr = el('tr');
      tr.appendChild(el('td', 'rank', r.intRank));
      var td = el('td', 'team'), d = el('div', 'tm');
      if (r.strBadge) { var img = el('img'); img.src = r.strBadge + '/tiny'; img.alt = ''; d.appendChild(img); }
      d.appendChild(el('span', null, r.strTeam));
      td.appendChild(d); tr.appendChild(td);
      [r.intPlayed, r.intWin, r.intDraw, r.intLoss, r.intGoalDifference].forEach(function (v) { tr.appendChild(el('td', null, v)); });
      tr.appendChild(el('td', 'pts', r.intPoints));
      tb.appendChild(tr);
    });
    t.appendChild(tb); box.appendChild(t);
  }).catch(fail);
})();
</script>
</body>
</html>
